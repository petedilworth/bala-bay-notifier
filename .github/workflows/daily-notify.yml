name: Daily Muskoka Water Levels

on:
  schedule:
    # Run daily at 7:00 AM Eastern Time
    # GitHub Actions uses UTC, so 11:00 UTC = 7am EDT (summer, UTC-4)
    # In winter (EST, UTC-5) this fires at 6am — acceptable trade-off
    - cron: '0 11 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

concurrency:
  group: daily-notify
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Send water level notification
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node notify.mjs

      # Reads data/ only — no network. Runs even when the send above failed, so
      # a Resend outage can't freeze the dashboard: notify.mjs refreshes the
      # caches before it sends, and those refreshed caches are what the site is
      # built from.
      - name: Build dashboard site
        if: always()
        run: npm run build:site

      - name: Save updated data and site
        if: always()
        run: |
          if [ ! -d data ]; then
            echo "No data directory — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update cached water data and rebuild site"
          git push
